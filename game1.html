<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>AJJRA Space Shooter</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050510;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 15px;
    background:#151522;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    background:#00e5ff;
}

#score{
    font-size:18px;
}

canvas{
    display:block;
    margin:auto;
    background:
    radial-gradient(circle at 50% 50%,
    #151530 0%,
    #050510 70%);
}

.controls{
    position:fixed;
    bottom:15px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:25px;
}

.control{
    width:65px;
    height:55px;
    font-size:24px;
    background:#242435;
    color:white;
}

</style>
</head>

<body>

<header>

<button class="back"
onclick="location.href='../index.html'">
← BACK
</button>

<div>
🚀 AJJRA SPACE
</div>

<div id="score">
Score: 0
</div>

</header>

<canvas id="game"></canvas>

<div class="controls">

<button class="control"
ontouchstart="moveLeft=true"
ontouchend="moveLeft=false">
◀
</button>

<button class="control"
ontouchstart="shoot()">
🔥
</button>

<button class="control"
ontouchstart="moveRight=true"
ontouchend="moveRight=false">
▶
</button>

</div>


<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

let width;
let height;

function resize(){

width=Math.min(window.innerWidth,600);

height=window.innerHeight-60;

canvas.width=width;

canvas.height=height;

}

resize();

window.addEventListener("resize",resize);


let player={
x:width/2,
y:height-90,
width:35,
height:35,
speed:6
};


let bullets=[];

let enemies=[];

let score=0;

let moveLeft=false;

let moveRight=false;

let gameOver=false;


function shoot(){

if(gameOver)return;

bullets.push({

x:player.x,

y:player.y-20,

width:5,

height:12,

speed:8

});

}


function createEnemy(){

if(gameOver)return;

enemies.push({

x:Math.random()*(width-30),

y:-40,

width:30,

height:30,

speed:2+Math.random()*2

});

}


setInterval(createEnemy,800);


document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")
moveLeft=true;

if(e.key==="ArrowRight")
moveRight=true;

if(e.key===" ")
shoot();

});

document.addEventListener("keyup",e=>{

if(e.key==="ArrowLeft")
moveLeft=false;

if(e.key==="ArrowRight")
moveRight=false;

});


function drawPlayer(){

ctx.font="35px Arial";

ctx.textAlign="center";

ctx.fillText(
"🚀",
player.x,
player.y
);

}


function drawBullets(){

ctx.fillStyle="#00e5ff";

bullets.forEach(b=>{

ctx.fillRect(
b.x,
b.y,
b.width,
b.height
);

});

}


function drawEnemies(){

ctx.font="30px Arial";

ctx.textAlign="center";

enemies.forEach(e=>{

ctx.fillText(
"👾",
e.x,
e.y
);

});

}


function update(){

if(moveLeft)
player.x-=player.speed;

if(moveRight)
player.x+=player.speed;

if(player.x<20)
player.x=20;

if(player.x>width-20)
player.x=width-20;


bullets.forEach(b=>{
b.y-=b.speed;
});

bullets=bullets.filter(
b=>b.y>-20
);


enemies.forEach(e=>{
e.y+=e.speed;
});


enemies=enemies.filter(
e=>e.y<height+50
);


for(let i=bullets.length-1;i>=0;i--){

for(let j=enemies.length-1;j>=0;j--){

let b=bullets[i];

let e=enemies[j];

let hit=

b.x>e.x-20 &&
b.x<e.x+20 &&
b.y>e.y-20 &&
b.y<e.y+20;

if(hit){

bullets.splice(i,1);

enemies.splice(j,1);

score+=10;

document.getElementById(
"score"
).innerText=
"Score: "+score;

break;

}

}

}


enemies.forEach(e=>{

let hit=

Math.abs(e.x-player.x)<30 &&
Math.abs(e.y-player.y)<30;

if(hit){

gameOver=true;

}

});

}


function draw(){

ctx.clearRect(
0,
0,
width,
height
);

drawPlayer();

drawBullets();

drawEnemies();

if(gameOver){

ctx.fillStyle="white";

ctx.font="30px Arial";

ctx.textAlign="center";

ctx.fillText(
"GAME OVER",
width/2,
height/2
);

ctx.font="18px Arial";

ctx.fillText(
"Refresh to play again",
width/2,
height/2+40
);

}

}


function loop(){

if(!gameOver)
update();

draw();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
