<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AJJRA GAMES</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#070914;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

header{
  background:#101525;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #26304a;
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#00e5ff;
}

.search{
  width:100%;
  margin-top:14px;
  padding:13px 15px;
  border:1px solid #303a56;
  border-radius:12px;
  background:#171e31;
  color:#fff;
  outline:none;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
}

.category{
  flex:none;
  border:0;
  border-radius:22px;
  padding:9px 15px;
  background:#202941;
  color:#fff;
}

.category.active{
  background:#00e5ff;
  color:#000;
}

main{
  padding:18px;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:15px;
}

.card{
  background:#111827;
  border:1px solid #27324c;
  border-radius:16px;
  overflow:hidden;
}

.icon{
  height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  background:#182137;
}

.cardBody{
  padding:13px;
}

.cardTitle{
  font-size:17px;
  font-weight:bold;
}

.cardCategory{
  color:#8490aa;
  font-size:13px;
  margin:5px 0 12px;
}

.playBtn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#00e5ff;
  color:#001014;
  font-weight:bold;
  font-size:14px;
}

footer{
  text-align:center;
  color:#66708a;
  padding:30px 10px;
}

/* GAME */

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#03050b;
}

.gameHeader{
  height:60px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  background:#101525;
  border-bottom:1px solid #29334d;
}

.backBtn{
  border:0;
  border-radius:9px;
  padding:10px 12px;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
}

#gameName{
  flex:1;
  text-align:center;
  font-weight:bold;
}

#scoreText{
  min-width:72px;
  text-align:right;
  font-size:14px;
}

#gameArea{
  position:absolute;
  left:0;
  right:0;
  top:60px;
  bottom:88px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

#canvas{
  display:block;
  background:#050814;
  max-width:100%;
  max-height:100%;
}

#htmlGame{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:10px;
  height:68px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:120;
}

.ctrl{
  width:70px;
  height:60px;
  border:0;
  border-radius:15px;
  background:#202941;
  color:#fff;
  font-size:25px;
  touch-action:none;
}

.ctrl:active{
  background:#00e5ff;
  color:#000;
}

#overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
  z-index:150;
}

.overlayBox{
  width:min(90%,360px);
  background:#111827;
  border:1px solid #33415f;
  border-radius:18px;
  padding:25px;
  text-align:center;
}

.overlayBox h2{
  margin-top:0;
}

.bigBtn{
  border:0;
  padding:13px 20px;
  border-radius:10px;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  margin:6px;
}

/* PUZZLE */

.puzzleWrap{
  width:100%;
  text-align:center;
}

.puzzleGrid{
  display:grid;
  grid-template-columns:repeat(3,75px);
  gap:9px;
  justify-content:center;
  margin-top:20px;
}

.puzzleGrid button{
  width:75px;
  height:75px;
  border:0;
  border-radius:12px;
  background:#202941;
  color:#fff;
  font-size:24px;
  font-weight:bold;
}

.puzzleGrid button:active{
  background:#00e5ff;
  color:#000;
}

/* FOOTBALL */

.field{
  position:relative;
  width:min(92vw,500px);
  height:min(75vh,650px);
  background:#075b2c;
  border:4px solid white;
  border-radius:18px;
  overflow:hidden;
}

.field:before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:50%;
  border-top:3px solid rgba(255,255,255,.8);
}

.circle{
  position:absolute;
  width:100px;
  height:100px;
  border:3px solid rgba(255,255,255,.8);
  border-radius:50%;
  top:calc(50% - 50px);
  left:calc(50% - 50px);
}

.goal{
  position:absolute;
  top:5px;
  left:50%;
  transform:translateX(-50%);
  font-size:65px;
}

.ball{
  position:absolute;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  font-size:55px;
  transition:.3s;
}

.goalkeeper{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  font-size:50px;
}

/* MESSAGE */

.empty{
  text-align:center;
  padding:40px;
  color:#7c879f;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🎮 <span>AJJRA</span> GAMES
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔍 Search games..."
  >

  <div class="categories">

    <button class="category active" data-cat="All">
      All
    </button>

    <button class="category" data-cat="Arcade">
      Arcade
    </button>

    <button class="category" data-cat="Puzzle">
      Puzzle
    </button>

    <button class="category" data-cat="Racing">
      Racing
    </button>

    <button class="category" data-cat="Sports">
      Sports
    </button>

    <button class="category" data-cat="Action">
      Action
    </button>

  </div>

</header>


<main>

  <h2>🔥 AJJRA GAMES</h2>

  <div id="games" class="games"></div>

</main>


<footer>
  © 2026 AJJRA GAMES
</footer>


<!-- GAME SCREEN -->

<section id="gameScreen">

  <div class="gameHeader">

    <button
      class="backBtn"
      id="backBtn">
      ← HOME
    </button>

    <div id="gameName">
      GAME
    </div>

    <div id="scoreText">
      Score: 0
    </div>

  </div>


  <div id="gameArea">

    <canvas id="canvas"></canvas>

    <div id="htmlGame"></div>

    <div id="overlay"></div>

  </div>


  <div class="controls">

    <button
      id="leftBtn"
      class="ctrl">
      ◀
    </button>

    <button
      id="actionBtn"
      class="ctrl">
      🔥
    </button>

    <button
      id="rightBtn"
      class="ctrl">
      ▶
    </button>

  </div>

</section>


<script>

/* =====================================================
   GAME LIST
===================================================== */

const GAME_LIST = [

  {
    id:"shooter",
    name:"Space Shooter",
    category:"Arcade",
    icon:"🚀"
  },

  {
    id:"puzzle",
    name:"Puzzle Master",
    category:"Puzzle",
    icon:"🧩"
  },

  {
    id:"racing",
    name:"Speed Racing",
    category:"Racing",
    icon:"🏎️"
  },

  {
    id:"football",
    name:"Football Star",
    category:"Sports",
    icon:"⚽"
  },

  {
    id:"action",
    name:"Action Hero",
    category:"Action",
    icon:"🔥"
  }

];


/* =====================================================
   DOM
===================================================== */

const gamesEl =
  document.getElementById("games");

const searchEl =
  document.getElementById("search");

const gameScreen =
  document.getElementById("gameScreen");

const gameArea =
  document.getElementById("gameArea");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const htmlGame =
  document.getElementById("htmlGame");

const overlay =
  document.getElementById("overlay");

const gameName =
  document.getElementById("gameName");

const scoreText =
  document.getElementById("scoreText");

const backBtn =
  document.getElementById("backBtn");

const leftBtn =
  document.getElementById("leftBtn");

const rightBtn =
  document.getElementById("rightBtn");

const actionBtn =
  document.getElementById("actionBtn");


/* =====================================================
   STATE
===================================================== */

let activeGame = null;

let gameRunning = false;

let animationFrame = null;

let score = 0;

let highScore = Number(
  localStorage.getItem("ajjraHighScore") || 0
);

let keys = {
  left:false,
  right:false
};

let W = 0;
let H = 0;


/* =====================================================
   RENDER GAME CARDS
===================================================== */

function renderGames(list){

  gamesEl.innerHTML = "";

  if(!list.length){

    gamesEl.innerHTML =
      `<div class="empty">
        No games found
       </div>`;

    return;
  }

  list.forEach(game => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="icon">
        ${game.icon}
      </div>

      <div class="cardBody">

        <div class="cardTitle">
          ${game.name}
        </div>

        <div class="cardCategory">
          ${game.category}
        </div>

        <button
          class="playBtn"
          data-game="${game.id}">
          ▶ PLAY
        </button>

      </div>
    `;

    gamesEl.appendChild(card);

  });

}


renderGames(GAME_LIST);


/* =====================================================
   SEARCH
===================================================== */

searchEl.addEventListener(
  "input",
  filter
);


function filter(){

  const q =
    searchEl.value
      .trim()
      .toLowerCase();

  const result =
    GAME_LIST.filter(game =>
      game.name
        .toLowerCase()
        .includes(q)
    );

  renderGames(result);

}


/* =====================================================
   CATEGORY
===================================================== */

document
.querySelectorAll(".category")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".category")
      .forEach(b =>
        b.classList.remove("active")
      );

      button.classList.add("active");

      const cat =
        button.dataset.cat;

      const result =
        cat === "All"
        ? GAME_LIST
        : GAME_LIST.filter(
            g => g.category === cat
          );

      renderGames(result);

    }
  );

});


/* =====================================================
   PLAY BUTTON
===================================================== */

gamesEl.addEventListener(
  "click",
  e => {

    const btn =
      e.target.closest(".playBtn");

    if(!btn)
      return;

    openGame(
      btn.dataset.game
    );

  }
);


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

  const rect =
    gameArea.getBoundingClientRect();

  W =
    Math.floor(
      Math.min(
        rect.width,
        620
      )
    );

  H =
    Math.floor(
      Math.max(
        320,
        rect.height
      )
    );

  canvas.width = W;
  canvas.height = H;

}


/* =====================================================
   SCORE
===================================================== */

function setScore(value){

  score =
    Math.max(0,Math.floor(value));

  scoreText.textContent =
    "Score: " + score;

}


/* =====================================================
   HIGH SCORE
===================================================== */

function saveHighScore(){

  if(score > highScore){

    highScore = score;

    localStorage.setItem(
      "ajjraHighScore",
      String(highScore)
    );

  }

}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(id){

  stopGame();

  activeGame = id;

  const game =
    GAME_LIST.find(
      g => g.id === id
    );

  gameName.textContent =
    game ? game.name : "GAME";

  gameScreen.style.display =
    "block";

  document.body.style.overflow =
    "hidden";

  overlay.style.display =
    "none";

  htmlGame.innerHTML = "";

  canvas.style.display =
    "block";

  setScore(0);

  resizeCanvas();

  if(id === "shooter")
    startShooter();

  if(id === "puzzle")
    startPuzzle();

  if(id === "racing")
    startRacing();

  if(id === "football")
    startFootball();

  if(id === "action")
    startAction();

}


/* =====================================================
   STOP GAME
===================================================== */

function stopGame(){

  gameRunning = false;

  if(animationFrame !== null){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }

  keys.left = false;
  keys.right = false;

  htmlGame.innerHTML = "";

  overlay.innerHTML = "";

  overlay.style.display =
    "none";

  canvas.onclick = null;

  actionBtn.onclick = null;

}


/* =====================================================
   HOME
===================================================== */

backBtn.addEventListener(
  "click",
  () => {

    stopGame();

    gameScreen.style.display =
      "none";

    document.body.style.overflow =
      "";

  }
);


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  if(!gameRunning)
    return;

  gameRunning = false;

  if(animationFrame !== null){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }

  saveHighScore();

  overlay.innerHTML = `

    <div class="overlayBox">

      <h2>💥 GAME OVER</h2>

      <p>
        Score: <b>${score}</b>
      </p>

      <p>
        Best: <b>${highScore}</b>
      </p>

      <button
        class="bigBtn"
        id="restartBtn">
        🔄 RESTART
      </button>

      <button
        class="bigBtn"
        id="homeBtn">
        🏠 HOME
      </button>

    </div>

  `;

  overlay.style.display =
    "flex";

  document
  .getElementById("restartBtn")
  .onclick = () =>
    openGame(activeGame);

  document
  .getElementById("homeBtn")
  .onclick = () =>
    backBtn.click();

}


/* =====================================================
   SPACE SHOOTER
===================================================== */

function startShooter(){

  resizeCanvas();

  actionBtn.textContent =
    "🔥";

  const player = {

    x:W/2,

    y:H-65,

    w:38,

    h:38,

    speed:7

  };

  const bullets = [];

  const enemies = [];

  let spawnTimer = 0;

  let frame = 0;


  function shoot(){

    bullets.push({

      x:player.x,

      y:player.y-25,

      speed:10

    });

  }


  actionBtn.onclick =
    shoot;


  gameRunning = true;


  function loop(){

    if(!gameRunning)
      return;

    frame++;

    ctx.fillStyle =
      "#030611";

    ctx.fillRect(
      0,0,W,H
    );


    /* stars */

    ctx.fillStyle =
      "#ffffff";

    for(
      let i=0;
      i<45;
      i++
    ){

      const x =
        (i*113)%W;

      const y =
        (i*71+frame*1.2)%H;

      ctx.fillRect(
        x,y,2,2
      );

    }


    /* player movement */

    if(keys.left)
      player.x -=
        player.speed;

    if(keys.right)
      player.x +=
        player.speed;

    player.x =
      Math.max(
        25,
        Math.min(
          W-25,
          player.x
        )
      );


    ctx.font =
      "40px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "🚀",
      player.x,
      player.y
    );


    /* bullets */

    for(
      let i=bullets.length-1;
      i>=0;
      i--
    ){

      const b =
        bullets[i];

      b.y -= b.speed;

      ctx.fillStyle =
        "#00e5ff";

      ctx.fillRect(
        b.x-2,
        b.y,
        4,
        14
      );

      if(b.y < -20)
        bullets.splice(i,1);

    }


    /* enemies */

    spawnTimer++;

    if(
      spawnTimer >
      Math.max(
        18,
        42-score/10
      )
    ){

      spawnTimer = 0;

      enemies.push({

        x:
          30 +
          Math.random()*
          (W-60),

        y:-30,

        speed:
          1.7+
          Math.random()*2.2

      });

    }


    for(
      let i=enemies.length-1;
      i>=0;
      i--
    ){

      const enemy =
        enemies[i];

      enemy.y +=
        enemy.speed;

      ctx.font =
        "31px Arial";

      ctx.fillText(
        "👾",
        enemy.x,
        enemy.y
      );


      /* player collision */

      if(
        Math.abs(
          enemy.x-player.x
        ) < 30 &&

        Math.abs(
          enemy.y-player.y
        ) < 35
      ){

        gameOver();

        return;

      }


      /* bullet collision */

      for(
        let j=bullets.length-1;
        j>=0;
        j--
      ){

        const b =
          bullets[j];

        if(
          Math.abs(
            b.x-enemy.x
          ) < 25 &&

          Math.abs(
            b.y-enemy.y
          ) < 25
        ){

          bullets.splice(j,1);

          enemies.splice(i,1);

          setScore(
            score+10
          );

          break;

        }

      }


      if(enemy.y > H+50){

        enemies.splice(i,1);

      }

    }


    animationFrame =
      requestAnimationFrame(
        loop
      );

  }


  loop();

}


/* =====================================================
   PUZZLE
===================================================== */

function startPuzzle(){

  canvas.style.display =
    "none";

  actionBtn.textContent =
    "🔄";

  htmlGame.innerHTML = `

    <div class="puzzleWrap">

      <h2>🧩 Puzzle Master</h2>

      <p id="puzzleText"></p>

      <div
        class="puzzleGrid"
        id="puzzleGrid">
      </div>

    </div>

  `;

  let level = 1;

  function newPuzzle(){

    const target =
      Math.floor(
        Math.random()*9
      )+1;

    document
    .getElementById(
      "puzzleText"
    )
    .textContent =
      "Level " +
      level +
      " — Click number " +
      target;

    const grid =
      document
      .getElementById(
        "puzzleGrid"
      );

    grid.innerHTML = "";

    for(
      let n=1;
      n<=9;
      n++
    ){

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        n;

      button.onclick = () => {

        if(n === target){

          setScore(
            score + 10
          );

          level++;

          newPuzzle();

        }

      };

      grid.appendChild(
        button
      );

    }

  }

  gameRunning = true;

  newPuzzle();

  actionBtn.onclick =
    newPuzzle;

}


/* =====================================================
   RACING
===================================================== */

function startRacing(){

  resizeCanvas();

  actionBtn.textContent =
    "💨";

  const car = {

    x:W/2,

    y:H-90,

    w:42,

    h:70,

    speed:7

  };

  const obstacles = [];

  let spawn = 0;

  let frame = 0;


  gameRunning = true;


  function loop(){

    if(!gameRunning)
      return;

    frame++;

    ctx.fillStyle =
      "#08702f";

    ctx.fillRect(
      0,0,W,H
    );


    /* road */

    const roadLeft =
      W*.18;

    const roadWidth =
      W*.64;

    ctx.fillStyle =
      "#222";

    ctx.fillRect(
      roadLeft,
      0,
      roadWidth,
      H
    );


    /* lane */

    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth = 5;

    const offset =
      (frame*7)%70;

    for(
      let y=-70+offset;
      y<H;
      y+=70
    ){

      ctx.beginPath();

      ctx.moveTo(
        W/2,
        y
      );

      ctx.lineTo(
        W/2,
        y+35
      );

      ctx.stroke();

    }


    /* movement */

    if(keys.left)
      car.x -=
        car.speed;

    if(keys.right)
      car.x +=
        car.speed;


    car.x =
      Math.max(
        roadLeft+25,
        Math.min(
          roadLeft+
          roadWidth-25,
          car.x
        )
      );


    ctx.font =
      "43px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "🏎️",
      car.x,
      car.y
    );


    /* spawn */

    spawn++;

    if(
      spawn >
      Math.max(
        18,
        45-score
      )
    ){

      spawn = 0;

      obstacles.push({

        x:
          roadLeft+30+
          Math.random()*
          (roadWidth-60),

        y:-50,

        speed:
          4+
          Math.min(
            5,
            score*.03
          )

      });

    }


    for(
      let i=obstacles.length-1;
      i>=0;
      i--
    ){

      const o =
        obstacles[i];

      o.y +=
        o.speed;

      ctx.font =
        "38px Arial";

      ctx.fillText(
        "🚧",
        o.x,
        o.y
      );


      if(
        Math.abs(
          o.x-car.x
        ) < 35 &&

        Math.abs(
          o.y-car.y
        ) < 45
      ){

        gameOver();

        return;

      }


      if(o.y > H+50){

        obstacles.splice(i,1);

        setScore(
          score+1
        );

      }

    }


    animationFrame =
      requestAnimationFrame(
        loop
      );

  }


  loop();

}


/* =====================================================
   FOOTBALL
===================================================== */

function startFootball(){

  canvas.style.display =
    "none";

  actionBtn.textContent =
    "⚽";

  htmlGame.innerHTML = `

    <div class="field">

      <div class="goal">
        🥅
      </div>

      <div class="circle"></div>

      <div class="goalkeeper">
        🧤
      </div>

      <div
        id="ball"
        class="ball">
        ⚽
      </div>

    </div>

  `;

  gameRunning = true;

  actionBtn.onclick =
    kick;

  function kick(){

    if(!gameRunning)
      return;

    const ball =
      document.getElementById(
        "ball"
      );

    ball.style.bottom =
      "72%";

    setTimeout(
      () => {

        if(!gameRunning)
          return;

        const goal =
          Math.random() > .25;

        if(goal){

          setScore(
            score+10
          );

        }

        ball.style.bottom =
          "75px";

      },
      450
    );

  }

}


/* =====================================================
   ACTION HERO
===================================================== */

function startAction(){

  resizeCanvas();

  actionBtn.textContent =
    "⚔️";

  const hero = {

    x:W/2,

    y:H-85,

    speed:7

  };

  const enemies = [];

  let spawn = 0;

  let attackTimer = 0;


  gameRunning = true;


  function attack(){

    attackTimer = 12;

    for(
      let i=enemies.length-1;
      i>=0;
      i--
    ){

      const e =
        enemies[i];

      if(
        Math.abs(
          e.x-hero.x
        ) < 75 &&

        Math.abs(
          e.y-hero.y
        ) < 90
      ){

        enemies.splice(i,1);

        setScore(
          score+10
        );

      }

    }

  }


  actionBtn.onclick =
    attack;


  function loop(){

    if(!gameRunning)
      return;

    ctx.fillStyle =
      "#130b1b";

    ctx.fillRect(
      0,0,W,H
    );


    if(keys.left)
      hero.x -=
        hero.speed;

    if(keys.right)
      hero.x +=
        hero.speed;

    hero.x =
      Math.max(
        30,
        Math.min(
          W-30,
          hero.x
        )
      );


    if(attackTimer > 0)
      attackTimer--;


    /* spawn */

    spawn++;

    if(
      spawn >
      Math.max(
        20,
        50-score
      )
    ){

      spawn = 0;

      enemies.push({

        x:
          30+
          Math.random()*
          (W-60),

        y:-40,

        speed:
          1.5+
          Math.random()*2

      });

    }


    /* hero */

    ctx.textAlign =
      "center";

    ctx.font =
      "45px Arial";

    ctx.fillText(
      attackTimer
      ? "⚔️"
      : "🦸",
      hero.x,
      hero.y
    );


    /* enemies */

    for(
      let i=enemies.length-1;
      i>=0;
      i--
    ){

      const e =
        enemies[i];

      e.y +=
        e.speed;

      ctx.font =
        "38px Arial";

      ctx.fillText(
        "👹",
        e.x,
        e.y
      );


      if(
        Math.abs(
          e.x-hero.x
        ) < 32 &&

        Math.abs(
          e.y-hero.y
        ) < 45
      ){

        gameOver();

        return;

      }


      if(e.y > H+50){

        enemies.splice(i,1);

      }

    }


    animationFrame =
      requestAnimationFrame(
        loop
      );

  }


  loop();

}


/* =====================================================
   TOUCH / POINTER CONTROLS
===================================================== */

function pressLeft(e){

  e.preventDefault();

  keys.left = true;

}

function releaseLeft(){

  keys.left = false;

}

function pressRight(e){

  e.preventDefault();

  keys.right = true;

}

function releaseRight(){

  keys.right = false;

}


leftBtn.addEventListener(
  "pointerdown",
  pressLeft
);

leftBtn.addEventListener(
  "pointerup",
  releaseLeft
);

leftBtn.addEventListener(
  "pointercancel",
  releaseLeft
);

leftBtn.addEventListener(
  "pointerleave",
  releaseLeft
);


rightBtn.addEventListener(
  "pointerdown",
  pressRight
);

rightBtn.addEventListener(
  "pointerup",
  releaseRight
);

rightBtn.addEventListener(
  "pointercancel",
  releaseRight
);

rightBtn.addEventListener(
  "pointerleave",
  releaseRight
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      keys.left = true;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      keys.right = true;

    }

    if(
      e.code === "Space"
    ){

      if(actionBtn.onclick)
        actionBtn.click();

    }

  }
);


document.addEventListener(
  "keyup",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      keys.left = false;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      keys.right = false;

    }

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    if(
      gameScreen.style.display ===
      "block"
    ){

      resizeCanvas();

    }

  }
);

</script>

</body>
</html>
