<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AJJRA GAMES</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#070711;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#11111d;
  padding:15px;
  border-bottom:1px solid #29293a;
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:bold;
}

.logo span{
  color:#00e5ff;
}

.search{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  outline:0;
  border-radius:10px;
  background:#242437;
  color:white;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:3px;
}

.cat{
  flex:none;
  padding:9px 15px;
  border-radius:20px;
  background:#242437;
  cursor:pointer;
}

.cat:active{
  transform:scale(.95);
}

.container{
  padding:18px;
}

.games{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}

.card{
  background:#151522;
  border:1px solid #29293a;
  border-radius:14px;
  overflow:hidden;
}

.gameIcon{
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:58px;
  background:#202033;
}

.info{
  padding:12px;
}

.title{
  font-weight:bold;
  margin-bottom:6px;
}

.small{
  color:#888;
  font-size:13px;
  margin-bottom:10px;
}

.play{
  width:100%;
  border:0;
  padding:11px;
  border-radius:8px;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.play:active{
  transform:scale(.97);
}

footer{
  text-align:center;
  color:#777;
  padding:30px;
}

/* GAME SCREEN */

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#050509;
}

.gameTop{
  height:58px;
  background:#11111d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px;
  gap:8px;
}

.back{
  background:#00e5ff;
  color:#000;
  border:0;
  padding:9px 12px;
  border-radius:8px;
  font-weight:bold;
}

#gameTitle{
  text-align:center;
  flex:1;
}

#gameScore{
  min-width:75px;
  text-align:right;
  font-size:14px;
}

#gameArea{
  position:absolute;
  top:58px;
  bottom:85px;
  left:0;
  right:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#gameCanvas{
  display:block;
  background:#050510;
  max-width:100%;
  max-height:100%;
}

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:12px;
  height:65px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  z-index:120;
}

.control{
  width:68px;
  height:58px;
  border:0;
  border-radius:14px;
  background:#29293d;
  color:white;
  font-size:24px;
  touch-action:none;
}

.control:active{
  background:#00e5ff;
  color:#000;
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:rgba(0,0,0,.72);
  z-index:130;
}

.panel{
  width:min(90%,360px);
  padding:25px;
  border-radius:18px;
  background:#151522;
  border:1px solid #33334a;
}

.panel h2{
  margin-top:0;
}

.bigButton{
  border:0;
  border-radius:10px;
  padding:13px 25px;
  background:#00e5ff;
  font-weight:bold;
  font-size:16px;
  margin-top:12px;
}

/* PUZZLE */

.puzzle{
  display:grid;
  grid-template-columns:repeat(3,75px);
  gap:10px;
  justify-content:center;
}

.puzzle button{
  height:75px;
  border:0;
  border-radius:12px;
  background:#29293d;
  color:white;
  font-size:25px;
}

.puzzle button:active{
  background:#00e5ff;
  color:#000;
}

/* FOOTBALL */

.footballField{
  width:min(90vw,500px);
  height:min(75vh,650px);
  border:4px solid white;
  border-radius:20px;
  position:relative;
  background:#073b20;
}

.goal{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:65px;
}

.ball{
  position:absolute;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  font-size:70px;
  transition:.25s;
}

/* MESSAGE */

.message{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🎮 <span>AJJRA</span> GAMES
  </div>

  <input
    id="search"
    class="search"
    placeholder="🔍 Search games..."
  >

  <div class="categories">
    <div class="cat" onclick="filterGames('All')">All</div>
    <div class="cat" onclick="filterGames('Arcade')">Arcade</div>
    <div class="cat" onclick="filterGames('Puzzle')">Puzzle</div>
    <div class="cat" onclick="filterGames('Racing')">Racing</div>
    <div class="cat" onclick="filterGames('Sports')">Sports</div>
    <div class="cat" onclick="filterGames('Action')">Action</div>
  </div>

</header>

<main class="container">

  <h2>🔥 AJJRA GAMES</h2>

  <div id="games" class="games"></div>

</main>

<footer>
  © 2026 AJJRA GAMES
</footer>


<!-- GAME SCREEN -->

<div id="gameScreen">

  <div class="gameTop">

    <button class="back" onclick="closeGame()">
      ← BACK
    </button>

    <b id="gameTitle">GAME</b>

    <b id="gameScore">
      Score: 0
    </b>

  </div>

  <div id="gameArea">

    <canvas id="gameCanvas"></canvas>

    <div id="htmlGame"></div>

    <div id="overlay"></div>

  </div>

  <div class="controls">

    <button
      class="control"
      id="leftBtn">
      ◀
    </button>

    <button
      class="control"
      id="actionBtn">
      🔥
    </button>

    <button
      class="control"
      id="rightBtn">
      ▶
    </button>

  </div>

</div>


<script>

/* =====================================================
   GAME DATABASE
===================================================== */

const games = [

  {
    id:1,
    name:"Space Shooter",
    category:"Arcade",
    emoji:"🚀"
  },

  {
    id:2,
    name:"Puzzle Master",
    category:"Puzzle",
    emoji:"🧩"
  },

  {
    id:3,
    name:"Speed Racing",
    category:"Racing",
    emoji:"🏎️"
  },

  {
    id:4,
    name:"Football Star",
    category:"Sports",
    emoji:"⚽"
  },

  {
    id:5,
    name:"Action Hero",
    category:"Action",
    emoji:"🔥"
  }

];


/* =====================================================
   DOM
===================================================== */

const gamesBox =
  document.getElementById("games");

const gameScreen =
  document.getElementById("gameScreen");

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

const htmlGame =
  document.getElementById("htmlGame");

const overlay =
  document.getElementById("overlay");

const gameTitle =
  document.getElementById("gameTitle");

const gameScore =
  document.getElementById("gameScore");

const leftBtn =
  document.getElementById("leftBtn");

const rightBtn =
  document.getElementById("rightBtn");

const actionBtn =
  document.getElementById("actionBtn");


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentGame = 0;

let running = false;

let animationId = null;

let score = 0;

let left = false;

let right = false;

let width = 0;

let height = 0;

let bullets = [];

let enemies = [];

let objects = [];


/* =====================================================
   SHOW GAMES
===================================================== */

function showGames(list){

  gamesBox.innerHTML = "";

  if(list.length === 0){

    gamesBox.innerHTML =
      `<div class="message">
        No games found.
       </div>`;

    return;
  }

  list.forEach(game => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="gameIcon">
        ${game.emoji}
      </div>

      <div class="info">

        <div class="title">
          ${game.name}
        </div>

        <div class="small">
          ${game.category}
        </div>

        <button
          class="play"
          onclick="openGame(${game.id})">

          ▶ PLAY

        </button>

      </div>

    `;

    gamesBox.appendChild(card);

  });

}

showGames(games);


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener("input",function(){

  const text =
    this.value.toLowerCase();

  showGames(
    games.filter(game =>
      game.name
      .toLowerCase()
      .includes(text)
    )
  );

});


/* =====================================================
   CATEGORY
===================================================== */

function filterGames(category){

  if(category === "All"){

    showGames(games);

    return;
  }

  showGames(
    games.filter(game =>
      game.category === category
    )
  );

}


/* =====================================================
   SCORE
===================================================== */

function setScore(value){

  score = value;

  gameScore.innerText =
    "Score: " + score;

}


/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas(){

  const area =
    document.getElementById("gameArea");

  width =
    Math.min(
      area.clientWidth,
      600
    );

  height =
    Math.max(
      300,
      area.clientHeight
    );

  canvas.width = width;

  canvas.height = height;

}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(id){

  stopGame();

  currentGame = id;

  gameScreen.style.display =
    "block";

  document.body.style.overflow =
    "hidden";

  const game =
    games.find(g => g.id === id);

  gameTitle.innerText =
    game ? game.name : "GAME";

  htmlGame.innerHTML = "";

  overlay.innerHTML = "";

  canvas.style.display =
    "block";

  resizeCanvas();

  setScore(0);

  if(id === 1)
    startSpaceShooter();

  else if(id === 2)
    startPuzzle();

  else if(id === 3)
    startRacing();

  else if(id === 4)
    startFootball();

  else if(id === 5)
    startAction();

}


/* =====================================================
   CLOSE GAME
===================================================== */

function closeGame(){

  stopGame();

  gameScreen.style.display =
    "none";

  document.body.style.overflow =
    "";

}


/* =====================================================
   STOP EVERYTHING
===================================================== */

function stopGame(){

  running = false;

  if(animationId !== null){

    cancelAnimationFrame(
      animationId
    );

    animationId = null;

  }

  bullets = [];

  enemies = [];

  objects = [];

  left = false;

  right = false;

  canvas.onclick = null;

  htmlGame.innerHTML = "";

  overlay.innerHTML = "";

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function clearCanvas(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

}


/* =====================================================
   SPACE SHOOTER
===================================================== */

let player = {
  x:0,
  y:0,
  speed:7
};


function startSpaceShooter(){

  canvas.style.display =
    "block";

  htmlGame.innerHTML =
    "";

  resizeCanvas();

  player.x =
    width / 2;

  player.y =
    height - 60;

  bullets = [];

  enemies = [];

  setScore(0);

  running = true;

  let spawnTimer = 0;

  function loop(){

    if(!running)
      return;

    clearCanvas();

    /* background */

    ctx.fillStyle =
      "#050510";

    ctx.fillRect(
      0,
      0,
      width,
      height
    );

    /* stars */

    ctx.fillStyle =
      "white";

    for(let i=0;i<35;i++){

      const x =
        (i*97)%width;

      const y =
        (i*53 +
         Math.floor(score/10)*2)
        % height;

      ctx.fillRect(
        x,
        y,
        2,
        2
      );

    }

    /* movement */

    if(left)
      player.x -=
        player.speed;

    if(right)
      player.x +=
        player.speed;

    player.x =
      Math.max(
        20,
        Math.min(
          width-20,
          player.x
        )
      );

    /* player */

    ctx.font =
      "38px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "🚀",
      player.x,
      player.y
    );

    /* bullets */

    bullets.forEach(
      bullet => {

        bullet.y -= 10;

        ctx.fillStyle =
          "#00e5ff";

        ctx.fillRect(
          bullet.x-2,
          bullet.y,
          4,
          14
        );

      }
    );

    bullets =
      bullets.filter(
        b => b.y > -30
      );

    /* spawn enemies */

    spawnTimer++;

    if(spawnTimer > 35){

      spawnTimer = 0;

      enemies.push({

        x:
          25 +
          Math.random() *
          (width-50),

        y:-30,

        speed:
          2 +
          Math.random()*2.5

      });

    }

    /* enemies */

    enemies.forEach(
      enemy => {

        enemy.y +=
          enemy.speed;

        ctx.font =
          "30px Arial";

        ctx.fillText(
          "👾",
          enemy.x,
          enemy.y
        );

      }
    );

    /* bullet collision */

    for(
      let i=bullets.length-1;
      i>=0;
      i--
    ){

      for(
        let j=enemies.length-1;
        j>=0;
        j--
      ){

        const b =
          bullets[i];

        const e =
          enemies[j];

        if(
          Math.abs(
            b.x-e.x
          ) < 25 &&

          Math.abs(
            b.y-e.y
          ) < 25
        ){

          bullets.splice(i,1);

          enemies.splice(j,1);

          setScore(
            score+10
          );

          break;

        }

      }

    }

    /* player collision */

    for(const enemy of enemies){

      if(
        Math.abs(
          enemy.x-player.x
        ) < 30 &&

        Math.abs(
          enemy.y-player.y
        ) < 35
      ){

        endGame();

        return;

      }

    }

    enemies =
      enemies.filter(
        e =>
          e.y <
          height+50
      );

    animationId =
      requestAnimationFrame(
        loop
      );

  }

  loop();

}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

  if(!running)
    return;

  if(
    currentGame !== 1
  )
    return;

  bullets.push({

    x:player.x,

    y:player.y-25

  });

}


/* =====================================================
   PUZZLE
===================================================== */

function startPuzzle(){

  canvas.style.display =
    "none";

  htmlGame.innerHTML = `

    <div style="
      text-align:center;
      padding:20px;
      color:white;
    ">

      <h2>🧩 Puzzle Master</h2>

      <p id="puzzleQuestion">
        Find the correct number
      </p>

      <div
        id="puzzleBox"
        class="puzzle">
      </div>

    </div>

  `;

  createPuzzle();

}


function createPuzzle(){

  const box =
    document.getElementById(
      "puzzleBox"
    );

  if(!box)
    return;

  box.innerHTML = "";

  const correct =
    Math.floor(
      Math.random()*9
    ) + 1;

  document.getElementById(
    "puzzleQuestion"
  ).innerText =
    "Click number " +
    correct;

  for(
    let i=1;
    i<=9;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.innerText =
      i;

    button.onclick =
      function(){

        if(i === correct){

          setScore(
            score+10
          );

          createPuzzle();

        }

      };

    box.appendChild(
      button
    );

  }

}


/* =====================================================
   RACING
===================================================== */

function startRacing(){

  canvas.style.display =
    "block";

  resizeCanvas();

  setScore(0);

  running = true;

  let carX =
    width/2;

  let roadOffset = 0;

  let obstacle = {

    x:
      50 +
      Math.random()*
      (width-100),

    y:-100,

    speed:5

  };


  function loop(){

    if(!running)
      return;

    clearCanvas();

    /* road */

    ctx.fillStyle =
      "#202020";

    ctx.fillRect(
      width*.18,
      0,
      width*.64,
      height
    );

    /* road lines */

    ctx.strokeStyle =
      "white";

    ctx.lineWidth =
      5;

    roadOffset += 7;

    if(roadOffset > 60)
      roadOffset = 0;

    for(
      let y=-60+roadOffset;
      y<height;
      y+=80
    ){

      ctx.beginPath();

      ctx.moveTo(
        width/2,
        y
      );

      ctx.lineTo(
        width/2,
        y+40
      );

      ctx.stroke();

    }

    /* movement */

    if(left)
      carX -= 7;

    if(right)
      carX += 7;

    const minX =
      width*.18+30;

    const maxX =
      width*.82-30;

    carX =
      Math.max(
        minX,
        Math.min(
          maxX,
          carX
        )
      );

    /* obstacle */

    obstacle.y +=
      obstacle.speed;

    ctx.font =
      "42px Arial";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "🚧",
      obstacle.x,
      obstacle.y
    );

    /* car */

    ctx.fillText(
      "🏎️",
      carX,
      height-90
    );

    /* collision */

    if(
      Math.abs(
        carX-obstacle.x
      ) < 40 &&

      Math.abs(
        height-90-obstacle.y
      ) < 45
    ){

      endGame();

      return;

    }

    /* reset obstacle */

    if(
      obstacle.y >
      height+60
    ){

      obstacle.y = -60;

      obstacle.x =
        minX +
        Math.random() *
        (maxX-minX);

      setScore(
        score+1
      );

    }

    animationId =
      requestAnimationFrame(
        loop
      );

  }

  loop();

}


/* =====================================================
   FOOTBALL
===================================================== */

function startFootball(){

  canvas.style.display =
    "none";

  htmlGame.innerHTML = `

    <div
      class="footballField"
      id="footballField">

      <div class="goal">
        🥅
      </div>

      <div
        class="ball"
        id="footballBall">
        ⚽
      </div>

    </div>

  `;

  actionBtn.innerText =
    "⚽";

  actionBtn.onclick =
    kickBall;

}


function kickBall(){

  if(currentGame !== 4)
    return;

  const ball =
    document.getElementById(
      "footballBall"
    );

  if(!ball)
    return;

  ball.style.bottom =
    "70%";

  setTimeout(
    () => {

      if(
        currentGame === 4
      ){

        setScore(
          score+10
        );

        ball.style.bottom =
          "80px";

      }

    },
    300
  );

}


/* =====================================================
   ACTION HERO
===================================================== */

function startAction(){

  canvas.style.display =
    "block";

  resizeCanvas();

  setScore(0);

  running = true;

  let heroX =
    width/2;

  let enemy = {

    x:
      Math.random()*width,

    y:100,

    speed:2

  };


  function loop(){

    if(!running)
      return;

    clearCanvas();

    if(left)
      heroX -= 7;

    if(right)
      heroX += 7;

    heroX =
      Math.max(
        30,
        Math.min(
          width-30,
          heroX
        )
      );

    enemy.y +=
      enemy.speed;

    ctx.textAlign =
      "center";

    ctx.font =
      "45px Arial";

    ctx.fillText(
      "🦸",
      heroX,
      height-90
    );

    ctx.font =
      "38px Arial";

    ctx.fillText(
      "👹",
      enemy.x,
      enemy.y
    );

    /* enemy reaches hero */

    if(
      enemy.y >
      height-130
    ){

      if(
        Math.abs(
          enemy.x-heroX
        ) < 45
      ){

        endGame();

        return;

      }

      enemy.y = 80;

      enemy.x =
        30 +
        Math.random() *
        (width-60);

    }

    animationId =
      requestAnimationFrame(
        loop
      );

  }

  loop();

}


/* =====================================================
   ACTION ATTACK
===================================================== */

function attack(){

  if(
    !running ||
    currentGame !== 5
  )
    return;

  setScore(
    score+10
  );

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  running = false;

  if(animationId){

    cancelAnimationFrame(
      animationId
    );

    animationId = null;

  }

  overlay.innerHTML = `

    <div class="panel">

      <h2>💥 GAME OVER</h2>

      <p>
        Your Score:
        <strong>${score}</strong>
      </p>

      <button
        class="bigButton"
        onclick="restartGame()">

        🔄 PLAY AGAIN

      </button>

      <br>

      <button
        class="bigButton"
        onclick="closeGame()">

        🏠 HOME

      </button>

    </div>

  `;

}


function restartGame(){

  overlay.innerHTML = "";

  openGame(
    currentGame
  );

}


/* =====================================================
   BUTTON CONTROLS
===================================================== */

function holdLeft(){

  left = true;

}

function releaseLeft(){

  left = false;

}

function holdRight(){

  right = true;

}

function releaseRight(){

  right = false;

}


/* LEFT */

leftBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    holdLeft();

  }
);

leftBtn.addEventListener(
  "pointerup",
  releaseLeft
);

leftBtn.addEventListener(
  "pointercancel",
  releaseLeft
);

leftBtn.addEventListener(
  "pointerleave",
  releaseLeft
);


/* RIGHT */

rightBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    holdRight();

  }
);

rightBtn.addEventListener(
  "pointerup",
  releaseRight
);

rightBtn.addEventListener(
  "pointercancel",
  releaseRight
);

rightBtn.addEventListener(
  "pointerleave",
  releaseRight
);


/* ACTION */

actionBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    if(currentGame === 1)
      shoot();

    else if(currentGame === 4)
      kickBall();

    else if(currentGame === 5)
      attack();

  }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key ===
      "ArrowLeft"
    ){

      left = true;

    }

    if(
      e.key ===
      "ArrowRight"
    ){

      right = true;

    }

    if(
      e.code ===
      "Space"
    ){

      if(currentGame === 1)
        shoot();

      if(currentGame === 4)
        kickBall();

      if(currentGame === 5)
        attack();

    }

  }
);


document.addEventListener(
  "keyup",
  e => {

    if(
      e.key ===
      "ArrowLeft"
    ){

      left = false;

    }

    if(
      e.key ===
      "ArrowRight"
    ){

      right = false;

    }

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    if(
      gameScreen.style.display ===
      "block"
    ){

      resizeCanvas();

    }

  }
);


/* =====================================================
   RESET ACTION BUTTON
===================================================== */

function resetActionButton(){

  actionBtn.innerText =
    "🔥";

  actionBtn.onclick = null;

}

</script>

</body>
</html>
